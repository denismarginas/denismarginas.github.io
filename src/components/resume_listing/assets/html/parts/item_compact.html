<li{{ id_attr }} class="resume-card resume-card--compact bg-radial-primary" data-item-id="{{ item_id }}" data-model="{{ model }}" data-lang="{{ lang }}">
  {{ preview }}
  <div class="resume-card-content">
    <div class="resume-card-info">
      {{ title_html }}
      {{ description_html }}
      <div class="resume-card-meta">
        {{ lang_html }}
        {{ date_html }}
      </div>
    </div>
    {{ actions_html }}
  </div>
</li>
