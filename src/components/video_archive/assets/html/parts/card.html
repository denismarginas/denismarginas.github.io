<button type="button" class="video-archive-card card-outline" aria-label="{{ aria_label }}">
  <span class="video-archive-thumb">
    {{ image }}
    <span class="video-archive-play" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M8,5.14V19.14L19,12.14L8,5.14Z" /></svg>
    </span>
  </span>
  <span class="video-archive-info">
    <span class="video-archive-meta">{{ meta }}</span>
    <span class="video-archive-title">{{ title }}</span>
  </span>
</button>
