<article class="video-archive-popup"{{ style }}>
  <div class="video-archive-popup-media">{{ video }}</div>
  <div class="video-archive-popup-body">
    <p class="video-archive-popup-meta">{{ meta }}</p>
    <h2 class="video-archive-popup-title">{{ title }}</h2>
    <div class="video-archive-popup-text">{{ description }}</div>
    {{ buttons }}
  </div>
</article>
